name: CI

on:
  push:
    branches: [main, integration]
  pull_request:

jobs:
  build:
    name: Build & Test — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # rodio (namespace Media) enlaza ALSA en Linux; sus cabeceras no vienen
      # en ubuntu-latest. Sin esto, alsa-sys falla al compilar.
      - name: Install ALSA (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Format
        run: cargo fmt --check

      - name: Check
        run: cargo check

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Rust tests
        run: cargo test --all-targets

      - name: Serez conformance, regression, error-path, security and CLI tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\run_tests.ps1 -json conformance-${{ matrix.os }}.json

      - name: Serez conformance, regression, error-path, security and CLI tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./run_tests.sh --json conformance-${{ matrix.os }}.json

      # Uploaded even when the suite fails — a failing run is exactly the one
      # worth reading per test rather than by scrolling the log.
      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ matrix.os }}
          path: conformance-${{ matrix.os }}.json
          if-no-files-found: warn
