name: CI

on:
  push:
    # `improve` is where the work is done. `merge.ps1` merges it into
    # `integration` and `main` and pushes the release tag in one go, so without
    # `improve` here the first CI signal arrives after `main` is already red and
    # the tag is already burned — which is exactly how v10.0.0 got stuck.
    # `integration` is kept because a push to it should still be checked, even
    # though `merge.ps1` currently merges it locally without pushing.
    branches: [main, integration, improve]
  pull_request:

# Three OS jobs per run is too much to spend twice on a branch that has already
# moved on. `main` still runs every push to completion: its history is the one
# that has to stay readable.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build & Test — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # rodio (namespace Media) enlaza ALSA en Linux; sus cabeceras no vienen
      # en ubuntu-latest. Sin esto, alsa-sys falla al compilar.
      - name: Install ALSA (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Format
        run: cargo fmt --check

      - name: Check
        run: cargo check

      # DEC-M10-002. `cargo clippy` alone fails nothing — CI has never passed
      # `-D warnings`, so a warning introduced by a change was invisible and this
      # roadmap compared the per-site list by hand at every milestone boundary.
      # The gate is `current <= baseline`, keyed per lint and per file, so debt
      # cannot grow while a total stays still by cancelling out. Reducing it is
      # always allowed; `tools/clippy_baseline.py --write` banks the reduction.
      - name: Clippy (must not exceed the committed baseline)
        run: python tools/clippy_baseline.py --check

      - name: Rust tests
        run: cargo test --all-targets

      # Advisory, never blocking. The phase timings are compared against
      # `perf-baseline.txt` in a release build — a debug run would be several
      # times slower and warn every time — and a phase past its budget is
      # printed rather than failed. Timing on a shared runner is noisy, and a
      # flaky gate teaches people to re-run until green, which is how a real
      # regression gets merged. The `spread` column collected here on all three
      # runners is the evidence for whether any of these is stable enough to
      # become a gate later.
      - name: Performance phases (advisory)
        run: cargo test --release --test perf_budget -- --nocapture

      - name: Serez conformance, regression, error-path, security and CLI tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\run_tests.ps1 -json conformance-${{ matrix.os }}.json

      - name: Serez conformance, regression, error-path, security and CLI tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./run_tests.sh --json conformance-${{ matrix.os }}.json

      # Uploaded even when the suite fails — a failing run is exactly the one
      # worth reading per test rather than by scrolling the log.
      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ matrix.os }}
          path: conformance-${{ matrix.os }}.json
          if-no-files-found: warn

  # ── DEC-M10-001: the ecosystem canary as a gate ──────────────────────────
  #
  # Eight official packages, run against the core built from *this* checkout —
  # never against a released `sz`, which is the failure mode that would make the
  # signal meaningless.
  #
  # Pinned, per `ecosystem-pins.txt`. §7A's objection to running the canary
  # per-commit was that it makes every PR depend on repositories this one does
  # not control; a pin answers that, because the only thing that can turn this
  # red is a change here. `.github/workflows/ecosystem-daily.yml` runs the same
  # canary unpinned once a day, which is the other half and cannot block a PR.
  #
  # One OS: the packages are Serez source and the canary is a compatibility
  # signal about the *language*, not about the host. Cross-platform parity is
  # what the matrix above is for.
  ecosystem:
    name: Ecosystem canary (gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install ALSA
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Fetch the official packages at their pinned commits
        run: bash tools/fetch_ecosystem.sh

      # Builds the core from this checkout; `run_ecosystem.sh` does it without
      # `--skip-build`, so the binary under test is always the one this commit
      # produces.
      - name: Run the canary
        run: bash run_ecosystem.sh
