name: CI

on:
  push:
    # `improve` is where the work is done. `merge.ps1` merges it into
    # `integration` and `main` and pushes the release tag in one go, so without
    # `improve` here the first CI signal arrives after `main` is already red and
    # the tag is already burned — which is exactly how v10.0.0 got stuck.
    # `integration` is kept because a push to it should still be checked, even
    # though `merge.ps1` currently merges it locally without pushing.
    branches: [main, integration, improve]
  pull_request:

# Three OS jobs per run is too much to spend twice on a branch that has already
# moved on. `main` still runs every push to completion: its history is the one
# that has to stay readable.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build & Test — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # rodio (namespace Media) enlaza ALSA en Linux; sus cabeceras no vienen
      # en ubuntu-latest. Sin esto, alsa-sys falla al compilar.
      - name: Install ALSA (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Format
        run: cargo fmt --check

      - name: Check
        run: cargo check

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Rust tests
        run: cargo test --all-targets

      - name: Serez conformance, regression, error-path, security and CLI tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\run_tests.ps1 -json conformance-${{ matrix.os }}.json

      - name: Serez conformance, regression, error-path, security and CLI tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./run_tests.sh --json conformance-${{ matrix.os }}.json

      # Uploaded even when the suite fails — a failing run is exactly the one
      # worth reading per test rather than by scrolling the log.
      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ matrix.os }}
          path: conformance-${{ matrix.os }}.json
          if-no-files-found: warn
