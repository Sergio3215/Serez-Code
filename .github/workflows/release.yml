name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust quality components
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Verify tag matches Cargo package version
        shell: bash
        run: |
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "serez-code") | .version')"
          test "v${package_version}" = "${GITHUB_REF_NAME}"

      - name: Format
        run: cargo fmt --check

      - name: Check
        run: cargo check

      # This was `cargo clippy --all-targets`, which fails nothing: clippy
      # exits 0 on warnings, so the release job's clippy step could not block a
      # release however much debt the tag carried. CI has gated on the baseline
      # since DEC-M10-002 and release did not, which is the worse way round —
      # a change could be blocked on a pull request and then shipped by a tag.
      # Same command, same policy, both places. §5.49.
      - name: Clippy (must not exceed the committed baseline)
        run: python tools/clippy_baseline.py --check

      - name: Rust tests
        run: cargo test --all-targets

      - name: Serez conformance, regression, error-path, security and CLI tests
        run: ./run_tests.sh

  build:
    name: Build — ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows x64
            target: x86_64-pc-windows-msvc
            binary: sz.exe
            asset: sz-windows-x64.exe
            flags: ""

          # Linux estático (musl): sin audio — enlazar ALSA en musl-static es
          # inviable. Media.* da un error capturable en este binario.
          - os: ubuntu-latest
            name: Linux x64
            target: x86_64-unknown-linux-musl
            binary: sz
            asset: sz-linux-x64
            flags: "--no-default-features"

          - os: macos-latest
            name: macOS ARM64
            target: aarch64-apple-darwin
            binary: sz
            asset: sz-macos-arm64
            flags: ""

          - os: macos-latest
            name: macOS x64
            target: x86_64-apple-darwin
            binary: sz
            asset: sz-macos-x64
            flags: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Without the refresh, `install` resolves against whatever package list
      # the runner image was baked with and 404s once it goes stale.
      - name: Install musl tools (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.flags }}

      - name: Package binary
        shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.asset }}

      - name: Install cargo-wix (Windows only)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo install cargo-wix --no-default-features

      - name: Build MSI installer (Windows only)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo wix --no-build --target x86_64-pc-windows-msvc --nocapture

      - name: Rename MSI (Windows only)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: cp target/wix/*.msi sz-windows-x64-setup.msi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Upload MSI artifact (Windows only)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/upload-artifact@v4
        with:
          name: sz-windows-x64-setup.msi
          path: sz-windows-x64-setup.msi

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Serez-Code ${{ github.ref_name }}" \
            --generate-notes \
            artifacts/sz-windows-x64-setup.msi \
            artifacts/sz-windows-x64.exe \
            artifacts/sz-linux-x64 \
            artifacts/sz-macos-arm64 \
            artifacts/sz-macos-x64 \
            artifacts/checksums.txt
